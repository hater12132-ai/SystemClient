name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Do NOT cancel in-progress builds — recursive submodules / NDK take a long time
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Prepare google-services.json
        env:
          GS_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "${GS_JSON_B64:-}" ]; then
            printf '%s' "$GS_JSON_B64" | base64 --decode > app/google-services.json
          else
            cat > app/google-services.json << 'JSON'
          {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"org.levimc.launcher"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyCIOnlyPlaceholderKey"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON
          fi
          python3 -m json.tool app/google-services.json > /dev/null

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Accept licenses and install build tools
        run: |
          set +e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.log 2>&1
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.12674087" >/tmp/sdk-install.log 2>&1
          set -e
          echo "SDK packages ready"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci-core"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Build SystemClient core (.so)
        if: hashFiles('native/SystemClientCore/xmake.lua') != ''
        working-directory: native/SystemClientCore
        run: |
          set -euo pipefail
          xmake f -y -p android -a arm64-v8a -m release --ndk="${{ steps.ndk.outputs.ndk-path }}"
          xmake -y
          SO=$(find build -type f -name 'libSystemClientCore.so' 2>/dev/null | head -1 || true)
          if [ -z "$SO" ]; then
            SO=$(find build -type f -name 'lib*.so' 2>/dev/null | head -1 || true)
          fi
          if [ -z "$SO" ] || [ ! -f "$SO" ]; then
            echo "::error::libSystemClientCore.so not produced"
            find build -type f 2>/dev/null | head -80 || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/systemclient_core"
          cp -f "$SO" "$GITHUB_WORKSPACE/app/src/main/assets/systemclient_core/libSystemClientCore.so"
          ls -la "$GITHUB_WORKSPACE/app/src/main/assets/systemclient_core/libSystemClientCore.so"

      - name: Require core SO in assets
        run: |
          SO="app/src/main/assets/systemclient_core/libSystemClientCore.so"
          if [ ! -f "$SO" ]; then
            echo "::error::Missing $SO"
            echo "Add native/SystemClientCore (xmake project) or commit a prebuilt libSystemClientCore.so under assets."
            exit 1
          fi
          # reject placeholder text files
          if file "$SO" | grep -qi 'text\|ASCII'; then
            echo "::error::$SO is not a binary shared library"
            exit 1
          fi
          ls -la "$SO"

      - name: Optional stable debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
            echo "Using stable debug keystore from secret."
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret; APK gets a fresh debug key every run."
          fi

      - name: Prepare Gradle
        run: |
          chmod +x ./gradlew
          echo "curseforge.api_key=" >> local.properties
          printf '%s\n' 'allprojects { tasks.configureEach { t -> if (t.name.startsWith("uploadCrashlytics")) { t.enabled = false } } }' > "$RUNNER_TEMP/ci-init.gradle"

      - name: Build debug APK
        run: ./gradlew assembleDebug -I "$RUNNER_TEMP/ci-init.gradle" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemClient-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload core SO (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SystemClientCore-so
          path: app/src/main/assets/systemclient_core/libSystemClientCore.so
          if-no-files-found: ignore
