name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare google-services.json
        env:
          GS_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "${GS_JSON_B64:-}" ]; then
            printf '%s' "$GS_JSON_B64" | base64 --decode > app/google-services.json
          else
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"dev.clarity.launch"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyCIOnlyPlaceholderKey"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi
          python3 -m json.tool app/google-services.json > /dev/null

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept licenses and install build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Optional stable debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
            echo "Using stable debug keystore from secret."
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret; APK gets a fresh debug key every run."
          fi

      - name: Prepare Gradle
        run: |
          chmod +x ./gradlew
          echo "curseforge.api_key=" >> local.properties
          printf '%s\n' 'allprojects { tasks.configureEach { t -> if (t.name.startsWith("uploadCrashlytics")) { t.enabled = false } } }' > "$RUNNER_TEMP/ci-init.gradle"

      - name: Build debug APK
        run: ./gradlew assembleDebug -I "$RUNNER_TEMP/ci-init.gradle"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClarityLaunch-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
